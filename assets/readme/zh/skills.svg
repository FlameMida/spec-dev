<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">spec-dev 的 13 个 skill 一览</title>
  <desc id="desc">主流程：exploring、requirement-analysis、writing-plans、executing-plans、quick-fix。工程纪律：clarifying、visual-preview、using-git-worktrees、test-driven-development、acceptance-qa。独立工具：ddd-lifecycle、anysearch、wtf。不属于 skill 的命令：/doctor、/triage、status。</desc>

  <rect width="1200" height="580" rx="24" fill="#FBFAF7"/>
  <rect x="0.75" y="0.75" width="1198.5" height="578.5" rx="23.5" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
    <g id="cards" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5">
      <rect x="48.75" y="48.75" width="350.5" height="482.5" rx="16"/>
      <rect x="424.75" y="48.75" width="350.5" height="482.5" rx="16"/>
      <rect x="800.75" y="48.75" width="350.5" height="482.5" rx="16"/>
    </g>

    <g id="chips">
      <rect x="68" y="70" width="26" height="26" rx="7" fill="#2563EB"/>
      <rect x="444" y="70" width="26" height="26" rx="7" fill="#0F172A"/>
      <rect x="820" y="70" width="26" height="26" rx="7" fill="#F59E0B"/>
      <g fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M74 83 L79 88 L88 78"/>
        <path d="M450 83 L455 88 L464 78"/>
        <path d="M826 83 L831 88 L840 78"/>
      </g>
    </g>

    <g id="headers" font-size="24" font-weight="700" fill="#0F172A">
      <text x="106" y="92">主流程</text>
      <text x="482" y="92">工程纪律</text>
      <text x="858" y="92">独立工具</text>
    </g>
    <g font-size="18" fill="#64748B">
      <text x="68" y="124">按情况选一个入口</text>
      <text x="444" y="124">流程里复用，也能单独用</text>
      <text x="820" y="124">随时可用</text>
    </g>

    <g id="dividers" stroke="#E2E8F0" stroke-width="1.5">
      <line x1="49" y1="140" x2="399" y2="140"/>
      <line x1="49" y1="218" x2="399" y2="218"/>
      <line x1="49" y1="296" x2="399" y2="296"/>
      <line x1="49" y1="374" x2="399" y2="374"/>
      <line x1="49" y1="452" x2="399" y2="452"/>
      <line x1="425" y1="140" x2="775" y2="140"/>
      <line x1="425" y1="218" x2="775" y2="218"/>
      <line x1="425" y1="296" x2="775" y2="296"/>
      <line x1="425" y1="374" x2="775" y2="374"/>
      <line x1="425" y1="452" x2="775" y2="452"/>
      <line x1="801" y1="140" x2="1151" y2="140"/>
      <line x1="801" y1="218" x2="1151" y2="218"/>
      <line x1="801" y1="296" x2="1151" y2="296"/>
      <line x1="801" y1="374" x2="1151" y2="374"/>
    </g>

    <g id="skill-names" font-size="21" font-weight="700" fill="#0F172A">
      <text x="68" y="174">exploring</text>
      <text x="68" y="252">requirement-analysis</text>
      <text x="68" y="330">writing-plans</text>
      <text x="68" y="408">executing-plans</text>
      <text x="68" y="486">quick-fix</text>
      <text x="444" y="174">clarifying</text>
      <text x="444" y="252">visual-preview</text>
      <text x="444" y="330">using-git-worktrees</text>
      <text x="444" y="408">test-driven-development</text>
      <text x="444" y="486">acceptance-qa</text>
      <text x="820" y="174">ddd-lifecycle</text>
      <text x="820" y="252">anysearch</text>
      <text x="820" y="330">wtf</text>
    </g>
    <g id="skill-roles" font-size="18" fill="#64748B">
      <text x="68" y="200">想清楚再决定做不做</text>
      <text x="68" y="278">需求 → 获批的一页 spec</text>
      <text x="68" y="356">spec → 可独立验证的小任务</text>
      <text x="68" y="434">逐任务 TDD 实施</text>
      <text x="68" y="512">已决定的小 bug 快修</text>
      <text x="444" y="200">一次一题，把决定磨清楚</text>
      <text x="444" y="278">浏览器里可点击的原型</text>
      <text x="444" y="356">准备隔离工作区</text>
      <text x="444" y="434">先写失败测试，再写代码</text>
      <text x="444" y="512">预期与实际并排，由你判断</text>
      <text x="820" y="200">DDD 领域建模与架构</text>
      <text x="820" y="278">实时联网搜索与正文抽取</text>
      <text x="820" y="356">大白话 + 终端图讲明白</text>
    </g>

    <g id="commands" font-size="18">
      <text x="820" y="412" font-size="20" font-weight="700" fill="#0F172A">命令</text>
      <text x="1131" y="412" text-anchor="end" fill="#64748B">不属于 skill</text>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700" fill="#0F172A">
        <text x="820" y="448">/doctor</text>
        <text x="820" y="478">/triage</text>
        <text x="820" y="508">status</text>
      </g>
      <g fill="#64748B">
        <text x="932" y="448">健康检查</text>
        <text x="932" y="478">推荐该走哪条流程</text>
        <text x="932" y="508">各工作区进度快照</text>
      </g>
    </g>
  </g>
</svg>
