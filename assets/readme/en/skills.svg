    <g id="skill-roles" font-size="18" fill="#64748B">
      <text x="68" y="200">think before you commit</text>
      <text x="68" y="278">request → one-page spec</text>
      <text x="68" y="356">spec → small, testable tasks</text>
      <text x="68" y="434">build task by task with TDD</text>
      <text x="68" y="512">small, decided bug fixes</text>
