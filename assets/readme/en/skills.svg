      <text x="482" y="92">Built-in disciplines</text>
      <text x="858" y="92">Handy extras</text>
    </g>
    <g font-size="18" fill="#64748B">
      <text x="68" y="124">pick one way in</text>
      <text x="444" y="124">used inside the flow, or alone</text>
      <text x="820" y="124">use anytime</text>
    </g>

    <g id="dividers" stroke="#E2E8F0" stroke-width="1.5">
      <line x1="49" y1="140" x2="399" y2="140"/>
      <line x1="49" y1="218" x2="399" y2="218"/>
      <line x1="49" y1="296" x2="399" y2="296"/>
