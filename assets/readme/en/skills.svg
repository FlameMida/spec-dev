      <text x="820" y="278">live web search</text>
      <text x="820" y="356">explain it like I’m 10</text>
    </g>

    <g id="commands" font-size="18">
      <text x="820" y="412" font-size="20" font-weight="700" fill="#0F172A">Commands</text>
      <text x="1131" y="412" text-anchor="end" fill="#64748B">not skills</text>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700" fill="#0F172A">
