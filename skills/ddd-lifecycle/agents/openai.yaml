  default_prompt: "Use $ddd-lifecycle for domain modeling, ubiquitous language, context mapping, entities and aggregates, domain events and repositories, hexagonal architecture, ADR decisions, or domain-model reviews. / 用 $ddd-lifecycle 开展领域建模、维护统一语言、划分限界上下文、设计实体与聚合及领域事件和仓储、搭建六边形架构、判断 ADR 或评审领域模型。"

policy:
  allow_implicit_invocation: true
