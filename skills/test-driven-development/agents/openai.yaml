interface:
  display_name: "Test-Driven Development"
  short_description: "行为变化先有效红再绿；批准的前置/收尾纯重构保绿，集成组逐票留证、统一验证，额外重构交收尾。"
  default_prompt: "Use $test-driven-development: follow the approved seam with red then green for behavior changes, preserve green behavior tests for wrap-up refactoring, and apply its authorized exceptions. / 用 $test-driven-development：行为变更沿获批落点先红后绿，收尾纯重构保持行为测试绿，例外依其单点与既有授权处理。"

policy:
  allow_implicit_invocation: true
