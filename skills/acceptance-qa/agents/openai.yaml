interface:
  display_name: "Acceptance QA"
  short_description: "对功能、页面或接口执行验收与故障诊断。页面默认核对定稿 HTML 和运行版本、对照实际布局交互及状态、复用业务证据并补验缺口；后端按行为契约，E2E、视觉、可访问性和性能专项按需执行。不用于日常跑测试、开发中 TDD 或需求文档审查。"
  default_prompt: "用 $acceptance-qa 验收目标功能、页面或接口；请提供明确目标（URL、端点或功能描述）以装配验收矩阵。"

policy:
  allow_implicit_invocation: true
