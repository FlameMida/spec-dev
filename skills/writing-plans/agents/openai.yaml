interface:
  display_name: "Writing Plans"
  short_description: "把获批 spec 写成 index.md + tasks/ + progress.yaml 三件套：类型化验证、必要前置重构、集成组与依赖五查；精确接口/关联 skill，progress 唯一记状态；任务给关键 diff 片段而非整文件，单任务 ≤ 200 行。"
  default_prompt: "Use $writing-plans to turn the approved spec into a detailed implementation plan. / 用 $writing-plans 把已批准的 spec 拆成详细实施计划。"

policy:
  allow_implicit_invocation: true
