interface:
  display_name: "Clarifying"
  short_description: "一次一题把一个想法、计划或决定问清楚（grill 式）：能自己查到的事实不问用户，需要用户拿主意的逐题问并附推荐。用户要求逐题追问、把某个想法/计划/决定磨清楚时使用；也被 exploring、requirement-analysis、quick-fix 和 visual-preview 引用。开放式的思考陪伴用 exploring；已决定要做的开发工作直接用 requirement-analysis 或 quick-fix。"
  default_prompt: "用 $clarifying 逐题把这个想法、计划或决定磨到共识。"

policy:
  allow_implicit_invocation: true
