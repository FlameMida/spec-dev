interface:
  display_name: "Quick Fix"
  short_description: "轻量 bug 修复工作流——已决定要修、无设计空间的小修复时使用：先按证据定位根因（含 spec 反查），逐题校对，沿获批落点 TDD 修复，必要验证与按需验收。跨 spec 契约、跨模块、新依赖、现行契约冲突或诊断证据不足时提议升级 requirement-analysis；偶发但可比较可继续。新功能、有设计空间的需求用 requirement-analysis；未决定要不要做用 exploring。"
  default_prompt: "用 $quick-fix 直接修掉这个小 bug 或小调整，不走完整设计流程。"

policy:
  allow_implicit_invocation: true
